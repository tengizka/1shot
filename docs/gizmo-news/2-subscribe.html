*{margin:0;box-sizing:border-box}
:root{--bg:#000;--fg:#fff;--lime:#a3ff10;--muted:#8d8d8d;--rule:#262626;--pink:#ff4fa3;--blue:#5b7bff;--orange:#ff8a1f;color-scheme:dark}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;font-family:Unb,system-ui,sans-serif;color:var(--fg)}
.stage{position:relative;width:1600px;height:900px;flex:none;transform-origin:center;overflow:hidden;background:var(--bg)}
.grid{position:absolute;inset:-80px;background-image:linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(90deg,#ffffff0d 2px,transparent 2px);background-size:80px 80px;animation:drift 18s linear infinite}
@keyframes drift{to{transform:translate(80px,80px)}}
.scan{position:absolute;left:0;right:0;height:180px;background:linear-gradient(transparent,#a3ff1012,transparent);animation:scan 7s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{top:-200px}60%,100%{top:960px}}
.logo{position:absolute;left:72px;top:60px;width:210px}
.logo path{fill:#fff}
.tag{position:absolute;right:72px;top:60px;font:700 22px Unb;letter-spacing:.14em;text-transform:uppercase;border:3px solid var(--lime);color:var(--lime);padding:12px 20px}
.mascot{position:absolute;width:300px;animation:float 5s ease-in-out infinite}
.mascot *{fill:var(--lime);stroke:var(--lime)}
#eyeL,#eyeR{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(-2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
h1{font:700 104px/.92 ReSquare,Unb,sans-serif;text-transform:uppercase;letter-spacing:.01em}
h1 .w{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.25,1) both}
h1 .lime{color:var(--lime)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.in{animation:fade .8s ease both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.note{font:500 20px/1.5 Unb;color:var(--muted);text-wrap:balance}
.pill{display:inline-block;background:var(--lime);color:#000;font:800 30px/1 Unb;padding:14px 22px;letter-spacing:.02em}
.qrbox{background:#fff;padding:14px;display:grid;place-items:center}
.qr{width:220px;height:220px;display:block}
/* No reduced-motion switch: these are club screen ads, and Windows with «animation effects» off turned them into empty frames. */

.copy{position:absolute;left:72px;top:150px;bottom:60px;width:780px;display:grid;gap:30px;align-content:center}
.big{font:700 32px/1.4 Unb}.big b{color:var(--lime)}
.cards{position:absolute;right:72px;top:150px;bottom:60px;display:flex;gap:28px;align-items:center}
.card{width:300px;border:3px solid var(--rule);padding:22px;display:grid;gap:16px;justify-items:center;background:#0b0b0b;animation:fade .8s ease both}
.card .qr{width:240px;height:240px}
.card h2{font:700 30px/1 ReSquare,Unb;text-transform:uppercase;display:flex;gap:12px;align-items:center}
.card h2 svg{width:34px;height:34px}
.card .pill{font-size:28px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mascot{left:72px;bottom:40px;width:120px;opacity:.9}
.total{font:700 26px Unb;color:var(--fg)}.total b{color:var(--lime)}
