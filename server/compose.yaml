name: oneshot-local
services:
  db:
    image: postgres:17.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneshot_owner
      POSTGRES_DB: oneshot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Run setup first}
    volumes:
      - database:/var/lib/postgresql/data
      - ./sql:/schema:ro
      - ../supabase/migrations:/migrations:ro
      - ./tools/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U oneshot_owner -d oneshot && psql -U oneshot_owner -d oneshot -tAc 'select version from local_schema where version=1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Intentionally no host ports: never publish PostgreSQL through the tunnel.
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://service_role:${API_DB_PASSWORD}@db:5432/oneshot
      AGENT_SECRET: ${AGENT_SECRET:?Set the existing Desk secret locally}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set bot token locally}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://api.tengizka.fun,http://localhost:8787,http://127.0.0.1:8787}
      BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8080"
      - "127.0.0.1:8788:8081"
    healthcheck:
      test: [CMD, deno, eval, "const r=await fetch('http://127.0.0.1:8080/healthz');if(!r.ok)Deno.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  database:
