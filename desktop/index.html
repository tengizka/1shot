<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1SHOT / CLUB DESK</title>
<link rel="stylesheet" href="assets/fonts/unbounded.css"><link rel="stylesheet" href="assets/fonts/resquare.css"><link rel="stylesheet" href="desk3.css">
<body>
<canvas id="matrix-rain" aria-hidden="true"></canvas>
<div id="desk-splash" aria-hidden="true"><div id="splash-loader"></div><p>CLUB DESK</p></div>

<div class="window-bar">
 <div class="pywebview-drag-region"><img src="assets/tray-icon.png" alt=""><span id="window-title">1SHOT / CLUB DESK</span></div>
 <div class="status-chips"><span id="connection">СЕРВЕР · …</span><span id="gizmo-connection">GIZMO · …</span><span id="clock-chip"></span></div>
 <div class="window-actions">
  <button onclick="invoke('minimize')" aria-label="Свернуть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h8"/></svg></button>
  <button onclick="invoke('maximize')" aria-label="Развернуть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
  <button onclick="invoke('close')" aria-label="Скрыть в трей"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
 </div>
</div>

<nav>
 <img class="brand-logo" src="assets/logo.svg" alt="1SHOT">
 <button class="tab active" data-panel="hall"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Зал</span></button>
 <button class="tab" data-panel="rentals"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="5"/><path d="M12 2v7M7 9h10"/></svg><span>Аренды</span><b id="rentals-count">0</b></button>
 <button class="tab" data-panel="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><span>Аккаунты</span><b id="requests-count">0</b></button>
 <button class="tab" data-panel="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Настройки</span></button>
 <button class="exit" onclick="invoke('quit')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Завершить работу</span></button>
 <div class="build-credit"><span id="build-version"></span><span id="build-author"></span></div>
</nav>

<main>
<p id="error" role="status"></p>

<section id="panel-hall" class="view-hall">
 <div class="hall-board">
  <div class="board-head">
   <div><h2>Зал</h2><span id="hall-summary" class="dim"></span></div>
   <div class="legend"><span><i class="lg free"></i>Свободен</span><span><i class="lg busy"></i>Занят</span><span><i class="lg reserved"></i>Бронь</span><span><i class="lg app"></i>Из мини-аппа</span><span><i class="lg unknown"></i>Нет связи</span></div>
  </div>
  <div id="desk-map" class="desk-plan" aria-label="Схема зала"></div>
 </div>
 <aside class="booking-column">
  <div class="section-heading">
   <h2 id="booking-title">Брони <span id="booking-total" class="dim"></span></h2>
   <button id="add-booking" aria-label="Добавить бронь"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span id="add-booking-label">Бронь</span></button>
  </div>
  <p id="pick-hint" class="pick-hint" hidden>Выберите ПК на карте</p>
  <div id="grid"></div>
 </aside>
</section>

<section id="panel-rentals" hidden>
 <div class="page-head"><h2>Аренды</h2><button id="rental-add" aria-label="Выдать вещь"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>Выдать</button></div>
 <form id="rental-form" class="surface rental-form" hidden>
  <div id="rental-items" class="rental-items" role="radiogroup" aria-label="Что выдали"></div>
  <div class="rental-who"><label>ПК<input id="rental-host" inputmode="numeric" maxlength="3" placeholder="104"></label><label>Кому<input id="rental-who" maxlength="60" placeholder="Ник или имя"></label><button id="rental-submit" disabled>Выдать</button></div>
  <p id="rental-message" role="status"></p>
 </form>
 <div id="rental-list" class="rental-list"></div>
</section>

<section id="panel-accounts" hidden>
 <div class="page-head"><h2>Аккаунты</h2></div>
 <div class="account-layout">
  <div class="surface">
   <h3>Сменить пароль</h3>
   
   <form id="find-user"><label>Никнейм, телефон, имя или фамилия<input id="account-search" maxlength="80" autocomplete="off" required></label><button>Найти аккаунт</button></form>
   <div id="account-options" class="account-options"></div><div id="account-result"></div>
   <form id="reset-user" hidden><label>Новый пароль<input type="password" id="new-password" minlength="3" maxlength="64" autocomplete="new-password" required></label><label class="check"><input type="checkbox" id="identity-checked" required> Личность владельца проверена</label><label id="privileged-wrap" class="check" hidden><input type="checkbox" id="privileged-checked"> Подтверждаю смену пароля служебной или неподтверждённой гостевой группы</label><button>Установить новый пароль</button></form>
   <p id="account-message" role="status"></p>
  </div>
  <div class="surface"><h3>Запросы на сброс</h3><div id="password-requests"></div></div>
 </div>
</section>

<section id="panel-sound" hidden>
 <div class="page-head"><h2>Настройки</h2><div class="settings-tabs" role="tablist"><button type="button" role="tab" data-settings="sound" aria-selected="true">Звук</button><button type="button" role="tab" data-settings="update" aria-selected="false">Обновление</button></div></div>
 <div class="settings-pane" data-settings="sound">
  <section class="surface sound-settings">
   <div class="sound-top"><label class="switch"><input type="checkbox" id="sound-enabled" checked><i aria-hidden="true"></i><span>Звук уведомлений</span></label>
   <label class="volume">Громкость <output id="volume-label">60%</output><input type="range" id="sound-volume" min="0" max="100" value="60"></label></div>
   <div id="sound-presets" class="sound-presets" role="radiogroup" aria-label="Мелодия"></div>
   <p id="sound-result" role="status"></p>
  </section>
 </div>
 <div class="settings-pane" data-settings="update" hidden>
  <section class="surface update-box" id="update-box">
   <h3>Обновление 1SHOT Desk</h3>
   <div class="update-row"><div><small>Установлена</small><b id="update-current">—</b></div><div><small>Последняя</small><b id="update-latest">—</b></div></div>
   <div class="update-progress" id="update-progress" hidden><i></i></div>
   <p id="update-message" class="note" role="status"></p>
   <div class="actions"><button type="button" id="update-check">Проверить обновления</button><button type="button" id="update-run" hidden>Обновить</button></div>
  </section>
 </div>
</section>
</main>

<script src="brand.js"></script><script src="assets/hall-map.js"></script><script src="assets/arrival-time.js"></script><script src="assets/oneshot-loader.js"></script><script src="desk.js"></script><script src="admin-tools.js"></script><script src="desk-menu.js"></script><script src="rentals.js"></script><script src="registrations.js"></script><script src="guest-passwords.js"></script><script src="desk-shell.js"></script></body></html>
