<script>
// Внутри Telegram (старые ссылки на корень) ведём в мини-апп, в браузере — на кейс в портфолио.
(function () {
  var q = location.search + location.hash;
  var inTelegram = /tgWebApp/.test(q) || typeof window.TelegramWebviewProxy !== "undefined" || /Telegram/i.test(navigator.userAgent);
  location.replace(inTelegram ? "miniapp/" + q : "https://tengizka.fun/work/1shot/");
})();
</script>
