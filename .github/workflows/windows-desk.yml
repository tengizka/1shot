name: Build Windows Desk
on:
  push:
    branches: [arena/01a0d663-1shot]
    paths: ['miniapp/**', 'index.html', 'tests/**', 'desktop/**', 'tests/test_*.py', 'tests/*browser.cjs', 'tests/*powershell.ps1', 'release/registration/**', '.github/workflows/windows-desk.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (desk-vX.Y.Z) that Desk can self-update from'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated browser fixtures
        run: |
          npm install --no-save --package-lock=false playwright-core@1.64.0 @sparticuz/chromium@153.0.0
          python -m desktop.write_metadata
          mkdir -p /tmp/chromium-libs
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/chromium-libs.tar',z.brotliDecompressSync(fs.readFileSync('node_modules/@sparticuz/chromium/bin/al2023.tar.br')))"
          tar -xf /tmp/chromium-libs.tar -C /tmp/chromium-libs
      - name: Check polling stability and existing Desk actions
        env:
          LD_LIBRARY_PATH: /tmp/chromium-libs/lib
        run: |
          node --test tests/hall.test.cjs
          node tests/hall-layout.cjs
          node tests/hall-zoom.cjs
          node tests/profile-feedback-browser.cjs
          node tests/club-v2-browser.cjs
          node tests/guest-passwords-browser.cjs
          node tests/registration-approval-browser.cjs
          node tests/desk-stability-browser.cjs
          node tests/desk-browser.cjs
          node tests/admin-tools-browser.cjs
          node tests/desk-availability-browser.cjs
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Test controller
        run: python -m unittest discover -s tests -p test_club_controller.py
      - name: Test account safety and shutdown
        run: python -m unittest discover -s tests -p test_desk_accounts.py
      - name: Test one-shot notifications, sounds and rentals
        run: python -m unittest tests.test_notifications tests.test_rentals
      - name: Test economical polling and cache safety
        run: python -m unittest discover -s tests -p test_economy.py
      - name: Test staff directory and password boundaries
        run: python -m unittest discover -s tests -p test_directory.py
      - name: Test manual reservation safety
        run: python -m unittest discover -s tests -p test_manual_controller.py
      - name: Test local backend configuration
        run: python -m unittest discover -s tests -p test_local_backend.py
      - name: Test strict registration
        run: python -m unittest discover -s tests -p test_registration.py
      - name: Test manual registration safety
        run: python -m unittest discover -s tests -p test_registration_approval.py
      - name: Test guest-selected password grants
        run: python -m unittest discover -s tests -p test_guest_passwords.py
      - name: Test on-screen notices and self-update
        run: python -m unittest tests.test_toast tests.test_updater
      - name: Stage registration frontend without publishing it
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'registration-preview'
          ./release/registration/Stage-Frontend.ps1 -OutputDirectory $target
          $indexFile = if (Test-Path miniapp/index.html) { 'miniapp/index.html' } else { 'index.html' }
          if ((Get-Content $indexFile -Raw).Contains('registration-wait.js')) { throw 'Production frontend must remain unchanged during staging' }
          if (-not (Get-Content (Join-Path $target 'index.html') -Raw).Contains('registration-wait.js')) { throw 'Staged frontend missing approval UI' }
      - name: Verify SQLite backup and read-only upgrade preflight
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_upgrade_backup.py
          ./tests/registration-upgrade-powershell.ps1
      - name: Test branding assets
        run: python -m unittest discover -s tests -p test_desktop_branding.py
      - name: Generate release identity
        run: python -m desktop.write_metadata
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --name 1SHOT-Desk --paths . --icon desktop/assets/app.ico --version-file desktop/version-info.txt --add-data "desktop/assets;desktop/assets" --add-data "desktop/*.js;desktop" --add-data "desktop/*.css;desktop" --add-data "desktop/index.html;desktop" --add-data "assets/fonts;assets/fonts" --collect-all webview --exclude-module webview.platforms.winforms --exclude-module webview.platforms.edgechromium --exclude-module clr --exclude-module pythonnet desktop/launcher.py
      - name: Launch packaged Qt UI and verify JS bridge (no club connections)
        shell: pwsh
        run: |
          $version = (Get-Item "dist\1SHOT-Desk\1SHOT-Desk.exe").VersionInfo
          $expected = python -c "from desktop.version import VERSION; print(VERSION)"
          if ($version.ProductVersion -ne $expected) { throw "EXE version metadata mismatch" }
          if ($version.Comments -ne "made tengizka") { throw "EXE author metadata missing" }
          $report = Join-Path (Get-Location) "dist\smoke-result.json"
          $proc = Start-Process -FilePath "dist\1SHOT-Desk\1SHOT-Desk.exe" -ArgumentList @("--smoke-test", "`"$report`"") -PassThru
          if (-not $proc.WaitForExit(90000)) { Stop-Process -Id $proc.Id -Force; throw "Packaged UI timed out" }
          if (-not (Test-Path $report)) { throw "Packaged UI crashed before writing its report" }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Packaged UI failed: $($result.error)" }
      - name: Verify packaged headless backup mode
        shell: pwsh
        run: |
          @{format='1shot-desk-tools-v1';backup_mode=1;sha256=(Get-FileHash -Algorithm SHA256 'dist/1SHOT-Desk/1SHOT-Desk.exe').Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content -Encoding UTF8 'dist/1SHOT-Desk/backup-capabilities.json'
          ./tests/registration-upgrade-powershell.ps1 -BackupExecutable (Resolve-Path 'dist/1SHOT-Desk/1SHOT-Desk.exe').Path
      - name: Include setup instructions (no credentials)
        shell: pwsh
        run: |
          Copy-Item desktop/env.example dist/1SHOT-Desk/env.example
          Copy-Item desktop/README.md dist/1SHOT-Desk/README.md
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = python -c "from desktop.version import VERSION; print(VERSION)"
          & $iscc "/DAppVersion=$version" desktop\installer\1shot-desk.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $hash = (Get-FileHash -Algorithm SHA256 dist\1SHOT-Desk-Setup.exe).Hash.ToLowerInvariant()
          "$hash  1SHOT-Desk-Setup.exe" | Set-Content -NoNewline -Encoding ascii dist\1SHOT-Desk-Setup.exe.sha256
          "DESK_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: 1SHOT-Desk-Windows
          path: dist/1SHOT-Desk/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 1SHOT-Desk-Setup
          path: |
            dist/1SHOT-Desk-Setup.exe
            dist/1SHOT-Desk-Setup.exe.sha256
          retention-days: 30
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [browser-regression, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 1SHOT-Desk-Setup
          path: setup
      - name: Publish release for self-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "from desktop.version import VERSION; print(VERSION)")
          TAG="desk-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; bump desktop/version.py"; exit 1; fi
          gh release create "$TAG" setup/1SHOT-Desk-Setup.exe setup/1SHOT-Desk-Setup.exe.sha256 --target "$GITHUB_SHA" --title "1SHOT Desk $VERSION" --notes "Установщик 1SHOT Desk $VERSION. Уже установленный Desk обновится сам: Настройки → Обновление."
