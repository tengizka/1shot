name: Build Windows Desk
on:
  push:
    branches: [arena/01a0d663-1shot]
    paths: ['desktop/**', 'tests/test_*.py', 'tests/*browser.cjs', 'release/registration/**', '.github/workflows/windows-desk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated browser fixtures
        run: |
          npm install --no-save --package-lock=false playwright-core@1.64.0 @sparticuz/chromium@153.0.0
          python -m desktop.write_metadata
          mkdir -p /tmp/chromium-libs
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/chromium-libs.tar',z.brotliDecompressSync(fs.readFileSync('node_modules/@sparticuz/chromium/bin/al2023.tar.br')))"
          tar -xf /tmp/chromium-libs.tar -C /tmp/chromium-libs
      - name: Check polling stability and existing Desk actions
        env:
          LD_LIBRARY_PATH: /tmp/chromium-libs/lib
        run: |
          node tests/registration-approval-browser.cjs
          node tests/desk-stability-browser.cjs
          node tests/desk-browser.cjs
          node tests/admin-tools-browser.cjs
          node tests/desk-availability-browser.cjs
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Test controller
        run: python -m unittest discover -s tests -p test_club_controller.py
      - name: Test account safety and shutdown
        run: python -m unittest discover -s tests -p test_desk_accounts.py
      - name: Test economical polling and cache safety
        run: python -m unittest discover -s tests -p test_economy.py
      - name: Test staff directory and password boundaries
        run: python -m unittest discover -s tests -p test_directory.py
      - name: Test manual reservation safety
        run: python -m unittest discover -s tests -p test_manual_controller.py
      - name: Test local backend configuration
        run: python -m unittest discover -s tests -p test_local_backend.py
      - name: Test strict registration
        run: python -m unittest discover -s tests -p test_registration.py
      - name: Test manual registration safety
        run: python -m unittest discover -s tests -p test_registration_approval.py
      - name: Stage registration frontend without publishing it
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'registration-preview'
          ./release/registration/Stage-Frontend.ps1 -OutputDirectory $target
          if ((Get-Content index.html -Raw).Contains('registration-wait.js')) { throw 'Production frontend must remain unchanged during staging' }
          if (-not (Get-Content (Join-Path $target 'index.html') -Raw).Contains('registration-wait.js')) { throw 'Staged frontend missing approval UI' }
      - name: Test branding assets
        run: python -m unittest discover -s tests -p test_desktop_branding.py
      - name: Generate release identity
        run: python -m desktop.write_metadata
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --name 1SHOT-Desk --paths . --icon desktop/assets/app.ico --version-file desktop/version-info.txt --add-data "desktop/assets;desktop/assets" --add-data "desktop/brand.js;desktop" --add-data "desktop/index.html;desktop" --add-data "desktop/desk.js;desktop" --add-data "desktop/admin-tools.js;desktop" --add-data "desktop/registrations.js;desktop" --add-data "desktop/desk.css;desktop" --add-data "desktop/polish.css;desktop" --add-data "desktop/polish.js;desktop" --add-data "assets/fonts;assets/fonts" --collect-all webview --exclude-module webview.platforms.winforms --exclude-module webview.platforms.edgechromium --exclude-module clr --exclude-module pythonnet desktop/launcher.py
      - name: Launch packaged Qt UI and verify JS bridge (no club connections)
        shell: pwsh
        run: |
          $version = (Get-Item "dist\1SHOT-Desk\1SHOT-Desk.exe").VersionInfo
          $expected = python -c "from desktop.version import VERSION; print(VERSION)"
          if ($version.ProductVersion -ne $expected) { throw "EXE version metadata mismatch" }
          if ($version.Comments -ne "made tengizka") { throw "EXE author metadata missing" }
          $report = Join-Path (Get-Location) "dist\smoke-result.json"
          $proc = Start-Process -FilePath "dist\1SHOT-Desk\1SHOT-Desk.exe" -ArgumentList @("--smoke-test", "`"$report`"") -PassThru
          if (-not $proc.WaitForExit(90000)) { Stop-Process -Id $proc.Id -Force; throw "Packaged UI timed out" }
          if (-not (Test-Path $report)) { throw "Packaged UI crashed before writing its report" }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Packaged UI failed: $($result.error)" }
      - name: Include setup instructions (no credentials)
        shell: pwsh
        run: |
          Copy-Item desktop/env.example dist/1SHOT-Desk/env.example
          Copy-Item desktop/README.md dist/1SHOT-Desk/README.md
          Copy-Item desktop/UPGRADE-1.1.md dist/1SHOT-Desk/UPGRADE-1.1.md
          Copy-Item desktop/UPGRADE-1.2.md dist/1SHOT-Desk/UPGRADE-1.2.md
          Copy-Item desktop/UPGRADE-1.3.md dist/1SHOT-Desk/UPGRADE-1.3.md
          Copy-Item desktop/UPGRADE-1.4.md dist/1SHOT-Desk/UPGRADE-1.4.md
          Copy-Item desktop/UPGRADE-1.5.md dist/1SHOT-Desk/UPGRADE-1.5.md
          Copy-Item desktop/UPGRADE-1.5.1.md dist/1SHOT-Desk/UPGRADE-1.5.1.md
          Copy-Item desktop/UPGRADE-1.6.md dist/1SHOT-Desk/UPGRADE-1.6.md
          Copy-Item desktop/UPGRADE-1.7.md dist/1SHOT-Desk/UPGRADE-1.7.md
      - uses: actions/upload-artifact@v4
        with:
          name: 1SHOT-Desk-Windows
          path: dist/1SHOT-Desk/
          retention-days: 30
          if-no-files-found: error
