name: Build Android app

# The guest app for Android: a window onto the 1SHOT mini-app (android/). Run by hand; publishes app-vX.Y.Z.
# Signing: secrets ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Without them the APK is signed with a throwaway key: it installs, but a later
# version signed differently will not install over it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/1shot.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/1shot.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: the APK is signed with a throwaway key"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ inputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk 1SHOT.apk
          sha256sum 1SHOT.apk > 1SHOT.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: 1SHOT-android
          path: |
            1SHOT.apk
            1SHOT.apk.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          gh release create "$TAG" 1SHOT.apk 1SHOT.apk.sha256 --target "$GITHUB_SHA" --latest=false --title "1SHOT для Android ${{ inputs.version }}" --notes "Приложение 1SHOT для Android: вход по нику и паролю от аккаунта клуба."
