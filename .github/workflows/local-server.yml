name: Test local server
on:
  push:
    branches: [arena/01a0d663-1shot]
    paths: ['server/**', 'supabase/migrations/**', 'supabase/functions/**', 'tests/*.test.ts', 'backend-config.js', 'index.html', '.dockerignore', '.github/workflows/local-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Typecheck and isolated integration tests
        run: |
          deno check server/main.ts server/tools/transfer.ts
          deno test -A server/tests/ tests/*.test.ts
      - name: Start actual PostgreSQL and standalone API (no club credentials)
        working-directory: server
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-owner-password\nAPI_DB_PASSWORD=ci-only-api-password\nAGENT_SECRET=ci-only-not-a-real-secret-long\nTELEGRAM_BOT_TOKEN=123:ci-only-test-token\n' > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Verify containers and isolated public/private routes
        run: python server/tests/container_smoke.py
      - name: Verify transfer with native PostgreSQL driver
        working-directory: server
        run: |
          docker compose exec -T -e CI_NATIVE_TRANSFER=YES -e LOCAL_ADMIN_DATABASE_URL=postgres://oneshot_owner:ci-only-owner-password@db:5432/oneshot api deno run --allow-net --allow-env --allow-read tests/native-transfer.ts
      - name: Verify native psql export format
        run: python server/tests/native-export-sql.py
      - name: Logs on failure
        if: failure()
        working-directory: server
        run: |
          docker compose logs --tail 100
          docker compose logs db | grep -E 'ERROR:|DETAIL:|HINT:' | while IFS= read -r line; do echo "::error::$line"; done
      - name: Stop test stack
        if: always()
        working-directory: server
        run: docker compose down -v
