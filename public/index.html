<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000004">
  <title>1SHOT — Киберхаус</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="banner" class="banner hidden"></div>

  <header class="header">
    <div class="header__row">
      <div class="brand">
        <img class="brand__logo" src="assets/logo.png" alt="1SHOT" onload="document.getElementById('logo-fallback')?.style.setProperty('display','none')"
             onerror="this.style.display='none';document.getElementById('logo-fallback')?.style.setProperty('display','flex')">
        <div id="logo-fallback" class="logo">1<span>SHOT</span></div>
        <div class="brand__meta">
          <div class="brand__greeting" id="greeting"></div>
          <div class="brand__addr" id="addr"></div>
        </div>
      </div>
      <button id="btn-refresh" class="icon-btn" type="button" title="Обновить">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <main class="main">
    <!-- Мои брони -->
    <section id="my-section" class="section">
      <h2 class="section__title"><i class="spark spark--pink"></i>Мои брони</h2>
      <div id="my-list" class="mylist"></div>
    </section>

    <!-- Режимы: карта / список -->
    <div class="tabs" role="tablist">
      <button class="tab active" type="button" data-view="map">Карта зала</button>
      <button class="tab" type="button" data-view="list">Список</button>
    </div>

    <!-- Карта -->
    <section id="view-map" class="section view">
      <div class="map-wrap">
        <div class="map" id="map">
          <div class="map__grid"></div>
          <div class="map__areas" id="map-areas"></div>
          <div class="map__lines" id="map-lines"></div>
          <div class="map__nodes" id="map-nodes"></div>
        </div>
        <div class="map-legend">
          <span><i class="dot dot--free"></i>свободен</span>
          <span><i class="dot dot--busy"></i>занят</span>
          <span><i class="dot dot--mine"></i>ваша бронь</span>
          <span><i class="dot dot--off"></i>не в сети</span>
        </div>
        <div id="map-extra" class="map-extra hidden"></div>
      </div>
    </section>

    <!-- Список по зонам -->
    <section id="view-list" class="section view hidden"></section>

    <footer class="footer" id="footer"></footer>
  </main>

  <!-- Шторка бронирования -->
  <div id="backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__glow"></div>
    <div class="sheet__handle"></div>
    <h3 class="sheet__title" id="sheet-title">Забронировать</h3>
    <div class="sheet__host" id="sheet-host"></div>
    <div class="sheet__label">Длительность</div>
    <div class="chips" id="chips"></div>
    <div class="sheet__ends" id="sheet-ends"></div>
    <button id="btn-confirm" class="btn" type="button">Забронировать</button>
    <div id="sheet-error" class="sheet__error hidden"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="map-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
