<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Бронь компа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="banner" class="banner hidden"></div>

  <header class="header">
    <div class="header__row">
      <div class="brand">
        <div class="brand__logo">1S</div>
        <div class="brand__text">
          <h1 class="brand__name" id="club-name">1SHOT</h1>
          <div class="brand__greeting" id="greeting"></div>
        </div>
      </div>
      <button id="btn-refresh" class="icon-btn" type="button" title="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <main class="main">
    <section id="my-section" class="section">
      <h2 class="section__title">Мои брони</h2>
      <div id="my-list" class="mylist"></div>
    </section>

    <section class="section">
      <h2 class="section__title">Компьютеры</h2>
      <div id="grid" class="grid"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>

  <!-- Шторка бронирования -->
  <div id="backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <h3 class="sheet__title" id="sheet-title">Забронировать</h3>
    <div class="sheet__host" id="sheet-host"></div>
    <div class="sheet__label">Длительность</div>
    <div class="chips" id="chips"></div>
    <div class="sheet__ends" id="sheet-ends"></div>
    <button id="btn-confirm" class="btn btn--primary" type="button">Забронировать</button>
    <div id="sheet-error" class="sheet__error hidden"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
